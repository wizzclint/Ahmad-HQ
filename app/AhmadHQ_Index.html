<style>

.label{font-size:10px;font-weight:900;text-transform:uppercase;color:#53665f}.value{font-size:25px;font-weight:900;margin:5px 0;color:#133E55}.sub{font-size:11px;color:var(--muted)}.goodtext{color:var(--good)}.badtext{color:var(--bad)}

.areaGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.area{min-height:102px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer}.area:nth-child(5n+1){background:var(--sage)}.area:nth-child(5n+2){background:var(--yellow)}.area:nth-child(5n+3){background:var(--blue)}.area:nth-child(5n+4){background:var(--lav)}.area:nth-child(5n){background:var(--peach)}.area b{margin-top:6px}.ico{font-size:24px}.homeBand{margin-top:11px}.loop{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.loop .card{text-align:center;background:#f7faf5;padding:10px}.principles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.principles .card{box-shadow:none;background:#fbfcf8}.areaGrid.homeAreas{grid-template-columns:repeat(5,1fr)}
.progress{height:8px;background:#E9EFEC;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--navy2)}.callout{border-left:4px solid var(--navy);background:var(--blue);padding:10px 12px;border-radius:8px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px}.form input,.form select,.form textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px;background:#fff}.full{grid-column:1/-1}.checkItem{border-top:1px solid #EDF1EF;padding:10px 0}.checkItem:first-of-type{border-top:0}.checkHead{display:flex;justify-content:space-between;gap:10px}.statusBtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.statusBtns button{border:1px solid var(--line);border-radius:8px;background:#fff;padding:6px 9px;cursor:pointer}.statusBtns button.pass{color:var(--good)}.statusBtns button.fail{color:var(--bad)}.statusBtns button.na{color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(8,23,35,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:30}.modal.open{display:flex}.modalBox{background:#fff;border-radius:15px;max-width:850px;width:100%;max-height:90vh;overflow:auto;padding:16px}.modalTop{display:flex;justify-content:space-between;align-items:center}.closex{border:0;background:transparent;font-size:23px;cursor:pointer}.mobileTop{display:none}

.planCard.sage{border-left-color:#8ca88d}.planCard.mint{border-left-color:#8fb9aa}.planCard.blue{border-left-color:#8aaac2}.planCard.lavender{border-left-color:#a99bbc}.planCard.peach{border-left-color:#cba58f}.planCard.yellow{border-left-color:#c7b86a}.planCard.gray{border-left-color:#98a0a4}
.planTop{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:10px}.planTop small{display:block;color:var(--muted);margin-top:4px}.planIcon{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--cream);margin-right:8px}.planObjective{display:grid;grid-template-columns:90px 1fr;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.planObjective span{font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:800}.planColumns{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding-top:10px}.planColumns h4{margin:0 0 7px;font-size:12px;color:var(--navy)}.planRow{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:start;padding:7px 0;border-bottom:1px dashed var(--line)}.planRow:last-child{border-bottom:0}.planRow small{display:block;color:var(--muted);margin-top:2px}
@media(max-width:760px){.planColumns{grid-template-columns:1fr}.planTop{flex-direction:column}.planObjective{grid-template-columns:1fr}}
 
</style>

<script>
const PAGE_CONFIG = {
 edible:{area:'Edible',title:'Edible Management',icon:'🍓',accent:'sage'},
 gardenia:{area:"Gardenia's Fire",title:"Gardenia's Fire",icon:'✿',accent:'mint'},
 finance:{area:'Finance & Office',title:'Finance & Office',icon:'$',accent:'blue'},
 legacy:{area:'Legacy Closeout',title:'Legacy Closeout',icon:'✓',accent:'lavender'},
 property:{area:'Buyahka / Property',title:'Buyahka / Property',icon:'⌂',accent:'peach'},
 people:{area:'People & Systems',title:'People & Systems',icon:'◎',accent:'yellow'},
 podcast:{area:'Podcast / Legacy',title:'Podcast & Legacy',icon:'▶',accent:'lavender'},
 personal:{area:'Personal / Ahmad',title:'Personal / Ahmad',icon:'A',accent:'sage'},
 iron:{area:'Iron Marks',title:'Iron Marks',icon:'◇',accent:'gray'}
};
const AREA_ALIASES={edible:['edible','edible operations','edible management'],gardenia:["gardenia's fire",'gardenias fire','gardenia'],finance:['finance & office','finance and office','finance'],legacy:['legacy closeout'],property:['buyahka / property','property'],people:['people & systems','people / systems','people'],podcast:['podcast / legacy','podcast & legacy','podcast'],personal:['personal / ahmad','ahmad personal finance / life','personal'],iron:['iron marks']};
function normArea(v){return String(v||'').trim().toLowerCase().replace(/\s+/g,' ')}
function areaMatch(key,v){let n=normArea(v),a=AREA_ALIASES[key]||[normArea(key)];return a.some(x=>n===normArea(x))}
function workForArea(key){return openWork().filter(x=>areaMatch(key,x['Project / Function']))}
function plansForArea(key){return (DATA.plans||[]).filter(x=>areaMatch(key,x['Business / Area']))}
function currentPlanRows(key){return plansForArea(key).filter(x=>!/done|closed|complete/i.test(x.Status||''))}
function reconciledPlanRows(key){let p=currentPlanRows(key);return p.length?p:workForArea(key)}
function areaKeyFromLabel(label){for(const k of Object.keys(AREA_ALIASES)){if(areaMatch(k,label))return k}return ''}
function reconciledPlanCountForLabel(label){let k=areaKeyFromLabel(label);if(k)return reconciledPlanRows(k).length;let n=normArea(label);if(n==='shared management')return openWork().filter(x=>/shared management/i.test(x['Project / Function']||'')).length;return 0}
function teamView(){if((DATA.people||[]).length)return DATA.people;let t=(DATA.teamDirectory||[]).map(x=>({Name:x.Name,Role:x.Role,'Function / Area':x.Area,'Active?':x['Active?'],Availability:'',Responsibilities:'','Coverage Status':'Directory'}));if(t.length)return t;let names={};openWork().forEach(x=>{if(x.Owner)names[x.Owner]={Name:x.Owner,Role:'Work Owner','Function / Area':x['Project / Function'],'Active?':'Yes','Coverage Status':'Derived from work'};});return Object.values(names)}
function registryView(){if((DATA.registries||[]).length)return DATA.registries;let seen={},out=[];(DATA.checklistDefs||[]).forEach(x=>{let key=[x.Business,x.Area,x['Checklist Name']].join('|');if(seen[key])return;seen[key]=1;out.push({'Registry Type':'Control','Business / Area':[x.Business,x.Area].filter(Boolean).join(' / '),Name:x['Checklist Name'],Owner:x['Owner Role'],'Cadence / Stage':x.Cadence,Status:/no/i.test(x['Active?']||'Yes')?'Inactive':'Active'});});return out}
function projectPlanBlock(key){const c=PAGE_CONFIG[key]||{area:key,title:key,icon:'◆',accent:'sage'};const plans=plansForArea(key),work=workForArea(key),active=currentPlanRows(key);const planCritical=active.filter(x=>/yes|true|critical/i.test(String(x['Critical Move?']||''))),workCritical=work.filter(x=>/yes/i.test(String(x['Critical Move?']||'')));const rows=planCritical.length?planCritical.slice(0,6):workCritical.slice(0,6);const objective=active[0]?.['Objective / Priority']||plans.slice(-1)[0]?.['Objective / Priority']||'Formal objective not yet entered.';const badgeText=active.length?`${active.length} open structured plan item${active.length===1?'':'s'}`:`${work.length} active execution item${work.length===1?'':'s'}`;const left=rows.map(x=>x['Work Item / Next Action']!==undefined?`<div class="planRow"><span>★</span><div><b>${esc(x['Work Item / Next Action'])}</b><small>${esc(x['WHY / OUTCOME SUPPORTED']||'')} • ${esc(x.Owner||'')}</small></div>${badge(x.Status)}</div>`:`<div class="planRow"><span>${/yes|true/i.test(String(x['Critical Move?']||''))?'★':'•'}</span><div><b>${esc(x['Objective / Priority'])}</b><small>${esc(x['Lead Behavior']||'')} ${x['Expected Outcome']?'→ '+esc(x['Expected Outcome']):''}</small></div>${badge(x.Status)}</div>`).join('')||'<div class="sub">No active Critical Moves linked to this area.</div>';return `<div class="card planCard ${esc(c.accent)}"><div class="planTop"><div><span class="planIcon">${esc(c.icon)}</span><b>PROJECT PLAN — ${esc(c.title)}</b><small>Objective → Critical Moves → This Week → Next Action → Owner → Due → Result</small></div><span class="badge">${esc(badgeText)}</span></div><div class="planObjective"><span>OBJECTIVE</span><b>${esc(objective)}</b></div><div class="planColumns"><div><h4>Critical Moves / Lead Behaviors</h4>${left}</div><div><h4>This Week / Next Actions</h4>${work.slice(0,6).map(x=>`<div class="planRow"><span>→</span><div><b>${esc(x['Work Item / Next Action'])}</b><small>${esc(x.Owner||'Unassigned')} • Due ${esc(x['Due Date']||'—')}</small></div>${badge(x.Status)}</div>`).join('')||'<div class="sub">No open work linked to this area.</div>'}</div></div></div>`}
 
 
let DATA={period:{},intelligence:{},work:[],checklistRuns:[],checklistDefs:[],targets:[],budgets:[],customers:[],reviews:[],exceptions:[],alerts:[],decisions:[],legacy:[],property:[],plans:[],registries:[],people:[],requests:[],sourceMap:[],readiness:[],periods:[],reference:[],training:[],financeReg:[],podcast:[],personalReg:[],customerFollowup:[],notificationRules:[],teamDirectory:[],access:[],ksi:[],gardeniaPipeline:[],systemAccess:[],gardeniaProduct:[],customerIssues:[]};
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function link(v,label){let u=String(v||'').trim();let low=u.toLowerCase();if(!(low.startsWith('http://')||low.startsWith('https://')))return esc(label||u||'—');return `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(label||'Open')}</a>`}
function money(v){let n=Number(String(v??'').replace(/[$,% ,]/g,''));return isNaN(n)?(v||'—'):n.toLocaleString('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0})}
function moneyMaybe(metric,v){let s=String(v??'—');if(s.includes('%'))return esc(s);return /revenue|ticket|profit/i.test(String(metric||''))?money(v):esc(s)}
function num(v){let n=Number(String(v??'').replace(/[,% ,]/g,''));return isNaN(n)?0:n}
function show(id,b){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');scrollTo(0,0)}
function mobileNext(){let ids=['home','work','store','edible','gardenia','finance','close','intel'];let c=ids.findIndex(i=>$(i).classList.contains('active'));show(ids[(c+1)%ids.length])}
function hdr(t,s){return `<div class="top"><div><h1>${t}</h1><p>${s}</p></div><div class="chips"><span class="chip">Week ${esc(DATA.period.week)}</span><span class="chip">${esc(DATA.period.monthName)} ${esc(DATA.period.year)}</span><span class="chip">YoY / Budget / Target</span></div></div>`}
function kpi(l,v,s=''){let q=String(l).replace(/'/g,"\'");return `<div class="card kpi" role="button" tabindex="0" style="cursor:pointer" onclick="openMetricDrill('${q}')"><div class="label">${l}</div><div class="value">${v}</div><div class="sub">${s}</div></div>`}
function badge(s){let c=/fail|blocked|high|missed|exception/i.test(s)?'bad':/progress|wait|attention|medium/i.test(s)?'warn':'';return `<span class="badge ${c}">${esc(s||'—')}</span>`}
function task(x){return `<div class="task"><span class="square"></span><div><b>${esc(x['Work Item / Next Action']||'')}</b><small>${esc(x['Project / Function']||'')} • ${esc(x.Owner||'')}</small></div>${badge(x.Status)}</div>`}
function runCard(r){let pct=num(r['Completion %']);return `<div class="card" onclick="openChecklist('${esc(r['Run ID'])}')" style="cursor:pointer"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(r['Checklist Name'])}</b>${badge(r.Status)}</div><div class="progress" style="margin:10px 0 5px"><i style="width:${Math.min(100,pct)}%"></i></div><small>${pct}% • ${esc(r['Completed Items'])}/${esc(r['Required Items'])} required • ${esc(r['Period Key'])}</small>${num(r.Exceptions)?`<div class="badtext" style="margin-top:6px;font-weight:800">${r.Exceptions} exception(s)</div>`:''}</div>`}
function currentRuns(business,area){let keys=[new Date().toISOString().slice(0,10),DATA.period.weekKey,DATA.period.monthKey];return DATA.checklistRuns.filter(r=>keys.includes(r['Period Key'])&&(!business||String(r.Business||'').toLowerCase().includes(business.toLowerCase()))&&(!area||String(r.Area||'').toLowerCase().includes(area.toLowerCase())))}
function openWork(){return DATA.work.filter(x=>!/done|complete|closed/i.test(x.Status||''))}
function latestTarget(business,metric){let a=DATA.targets.filter(x=>String(x.Business||'').toLowerCase().includes(business.toLowerCase())&&String(x.Metric||'').toLowerCase().includes(metric.toLowerCase()));return a[a.length-1]||{}}
function latestMonthlyTarget(business,metric){let a=DATA.targets.filter(x=>String(x.Business||'').toLowerCase().includes(business.toLowerCase())&&String(x.Metric||'').toLowerCase().includes(metric.toLowerCase())&&String(x.Month||'')===String(DATA.period.month));return a[a.length-1]||latestTarget(business,metric)}

(x.period)}</small></div><button class="btn" onclick="openChecklist('${esc(x.runId)}')">Open</button></div>`).join('')||'<div class="sub">No missing required evidence.</div>'}</div></div><div class="grid2"><div class="card"><h3 class="section">Weekly Intelligence Brief</h3><p><b>${esc(B.weekly?.period||'')}</b> • Completion ${esc(B.weekly?.completion||0)}% • Misses ${esc(B.weekly?.misses||0)} • Exceptions ${esc(B.weekly?.exceptions||0)} • Blocked ${esc(B.weekly?.blocked||0)} • Escalated ${esc(B.weekly?.escalated||0)}</p>${(B.weekly?.criticalMoves||[]).map(task).join('')||'<div class="sub">No open Critical Moves.</div>'}</div><div class="card"><h3 class="section">Drill-down — Missing Controls</h3>${(I.missedRuns||[]).map(x=>`<div class="task"><span>▦</span><div><b>${esc(x.name)}</b><small>${esc(x.owner)} • ${esc(x.period)}</small></div><button class="btn" onclick="openChecklist('${esc(x.runId)}')">${esc(x.pct)}%</button></div>`).join('')||'<div class="sub">No incomplete required controls.</div>'}</div></div><div class="grid2"><div class="card"><h3 class="section">Stale Work — 7+ Days</h3>${(I.staleWork||[]).map(x=>`<div class="task"><span>◴</span><div><b>${esc(x['Work Item / Next Action'])}</b><small>${esc(x.Owner)} • ${esc(x['Project / Function'])}</small></div><span class="badge warn">${esc(x['Calculated Age Days'])}d</span></div>`).join('')||'<div class="sub">No stale open work.</div>'}</div><div class="card"><h3 class="section">Recent Alerts</h3>${(I.recentAlerts||[]).map(a=>`<div class="task"><span>!</span><div><b>${esc(a.Message)}</b><small>${esc(a['Business / Area'])}</small></div>${badge(a.Severity)}</div>`).join('')||'<div class="sub">No open alerts.</div>'}</div></div><div class="card tableWrap" style="margin-top:11px"><h3 class="section">Company → Function → Work / Result / Control Roll-up</h3><table class="table"><tr><th>Area / Function</th><th>Open Work</th><th>Open Plans</th><th>Result Rows</th><th>Controls</th><th>Drill</th></tr>${(I.rollupGraph||[]).map(x=>`<tr><td>${esc(x.area)}</td><td>${esc(x.workOpen)}</td><td>${esc(Number(x.plansOpen)||reconciledPlanCountForLabel(x.area))}</td><td>${esc(x.targetCount)}</td><td>${esc(x.controlCount)}</td><td><button class="btn" onclick='showRowsModal(${JSON.stringify('Roll-up — '+x.area)},${JSON.stringify([...(x.rows.work||[]),...(x.rows.plans||[]),...(x.rows.targets||[]),...(x.rows.controls||[])])})'>Open rows</button></td></tr>`).join('')||'<tr><td colspan="6">Roll-up graph will populate from current data.</td></tr>'}</table></div><div class="grid3" style="margin-top:11px"><div class="card"><h3 class="section">Completion by Business</h3>${(I.completionBreakdown?.business||[]).map(x=>`<div class="task"><span>▦</span><div><b>${esc(x.name)}</b><small>${esc(x.runs)} runs</small></div><span class="badge">${esc(x.pct)}%</span></div>`).join('')}</div><div class="card"><h3 class="section">Completion by Area</h3>${(I.completionBreakdown?.area||[]).map(x=>`<div class="task"><span>▤</span><div><b>${esc(x.name)}</b><small>${esc(x.runs)} runs</small></div><span class="badge">${esc(x.pct)}%</span></div>`).join('')}</div><div class="card"><h3 class="section">Completion by Owner</h3>${(I.completionBreakdown?.owner||[]).map(x=>`<div class="task"><span>♟</span><div><b>${esc(x.name)}</b><small>${esc(x.runs)} runs</small></div><span class="badge">${esc(x.pct)}%</span></div>`).join('')}</div></div><div class="card" style="margin-top:11px"><h3 class="section">Recurring Exception Patterns</h3>${(I.recurringExceptions||[]).map(x=>`<div class="task"><span>↻</span><div><b>${esc(x.exception)}</b><small>${esc(x.area)} • ${esc(x.owner)}</small></div><span class="badge warn">${esc(x.count)}×</span></div>`).join('')||'<div class="sub">No repeated open-exception pattern detected.</div>'}</div>`}
</script>

<script>
function renderCustomers(){let c=DATA.customers||[],f=DATA.customerFollowup||[],ci=DATA.intelligence.customerIntel||{},ii=DATA.intelligence.customerIssueIntel||{},top=ci.top||[],lapsed=ci.lapsed||[],loaded=c.length>0;$('customers').innerHTML=hdr('EDIBLE — Customer Management',loaded?'Weekly customers • segmentation • Top 100/200 • recipients • follow-up • business opportunity':'Structure ready • authoritative customer dataset not yet populated')+`<div class="kpis">${kpi('Customers',loaded?c.length:'—',loaded?'current dataset':'source not populated')}${kpi('Repeat',ci.segments?.repeat||0)}${kpi('Recipients',ci.segments?.recipients||0)}${kpi('Top Ranked',top.length)}${kpi('Business Opps',ci.segments?.business||0)}${kpi('Open Follow-ups',ci.openFollowups||0)}</div><div class="grid2"><div class="card tableWrap"><h3 class="section">Top Customer / Relationship Ranking</h3><table class="table"><tr><th>Rank</th><th>Customer</th><th>Revenue</th><th>Orders</th><th>Recency</th><th>Stage</th><th>Business Opp</th><th>Score</th></tr>${top.slice(0,50).map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.Customer)}</td><td>${money(x.Revenue)}</td><td>${esc(x.Orders)}</td><td>${esc(x['Recency Days'])}d</td><td>${esc(x['Relationship Stage'])}</td><td>${esc(x['Business Opportunity?'])}</td><td>${esc(x['Relationship Score'])}</td></tr>`).join('')||'<tr><td colspan="8">Customer data will rank as it is populated.</td></tr>'}</table></div><div class="card"><h3 class="section">Prioritized Follow-up Queue</h3>${f.filter(x=>!/done|closed|complete/i.test(x.Status||'')).slice(-30).reverse().map(x=>`<div class="task"><span>⌕</span><div><b>${esc(x['Customer / Recipient'])}</b><small>${esc(x['Trigger / Segment'])} • ${esc(x.Owner)} • ${esc(x.Due)}</small></div>${badge(x.Priority||x.Status)}</div>`).join('')||'<div class="sub">No assigned follow-ups.</div>'}<h3 class="section" style="margin-top:14px">System-Suggested Follow-ups</h3>${(ci.suggestions||[]).slice(0,15).map(x=>`<div class="task"><span>＋</span><div><b>${esc(x.customer)}</b><small>${esc(x.trigger)} • ${esc(x.nextAction)}</small></div>${badge(x.priority)}</div>`).join('')||'<div class="sub">No additional suggestions from current customer data.</div>'}<h3 class="section" style="margin-top:14px">Lapsed / Reactivation Candidates</h3>${lapsed.slice(0,15).map(x=>`<div class="task"><span>↻</span><div><b>${esc(x.Customer)}</b><small>${esc(x['Recency Days'])}d since last order • ${money(x.Revenue)}</small></div>${badge(x['Relationship Stage']||'Reactivation')}</div>`).join('')||'<div class="sub">No lapsed candidates identified from current data.</div>'}</div></div><div class="grid2" style="margin-top:11px"><div class="card"><h3 class="section">Weekly Credits / Refunds / Voids / Customer Issues</h3><p><b>${esc(ii.week||'')}</b> • ${esc(ii.total||0)} issue(s) • value ${money(ii.totalValue||0)}</p>${Object.keys(ii.byType||{}).map(k=>`<div class="task"><span>!</span><div><b>${esc(k)}</b><small>${esc(ii.byType[k].count)} issue(s)</small></div><span class="badge warn">${money(ii.byType[k].value||0)}</span></div>`).join('')||'<div class="sub">No customer issue rows for this week.</div>'}</div><div class="card tableWrap"><h3 class="section">Reason / Recovery Detail</h3><table class="table"><tr><th>Type</th><th>Customer</th><th>Reason / Theme</th><th>Value</th><th>Severity</th><th>Recovery</th><th>Owner</th><th>Status</th></tr>${(ii.rows||[]).map(x=>`<tr><td>${esc(x['Issue Type'])}</td><td>${esc(x.Customer)}</td><td>${esc(x['Reason / Theme'])}</td><td>${money(x['Amount / Value'])}</td><td>${badge(x.Severity)}</td><td>${esc(x['Recovery / Action'])}</td><td>${esc(x.Owner)}</td><td>${badge(x.Status)}</td></tr>`).join('')||'<tr><td colspan="8">No issues logged.</td></tr>'}</table></div></div><div class="card tableWrap" style="margin-top:11px"><h3 class="section">Customer / Recipient Detail</h3><table class="table"><tr><th>Customer</th><th>Revenue</th><th>New / Repeat</th><th>Recipient</th><th>Business Opp</th><th>Stage</th><th>Owner</th><th>Due</th><th>Next Action</th></tr>${c.slice(-150).reverse().map(x=>`<tr><td>${esc(x.Customer)}</td><td>${money(x.Revenue)}</td><td>${esc(x['New / Repeat'])}</td><td>${esc(x['Recipient?'])}</td><td>${esc(x['Business Opportunity?'])}</td><td>${esc(x['Relationship Stage'])}</td><td>${esc(x.Owner)}</td><td>${esc(x.Due)}</td><td>${esc(x['Next Action'])}</td></tr>`).join('')}</table></div>`}
</script>

<script>
function renderAdd(){$('add').innerHTML=hdr('CAPTURE / INBOX','One capture point. Decide whether it becomes work, request/issue, note/idea, or parked material.')+`<div class="card form"><select id="ct"><option>WORK</option><option>REQUEST</option><option>ISSUE</option><option>NOTE</option><option>IDEA</option><option>PARK</option></select><input id="wf" placeholder="Business / Function / Area"><input id="wo" placeholder="Owner"><input id="wa" class="full" placeholder="What is it? / Next action / Note"><select id="wp"><option>PUSH</option><option>MAINTAIN</option><option>High</option><option>Medium</option><option>Low</option></select><input id="wd" placeholder="Due date"><input id="wwhy" class="full" placeholder="Why / outcome supported / context"><label><input id="wc" type="checkbox"> Critical Move</label><label><input id="wr" type="checkbox"> Result-producing</label><button class="btn primary full" onclick="submitCapture()">CAPTURE</button></div>`}
function submitCapture(){let o={captureType:$('ct').value,area:$('wf').value,owner:$('wo').value,text:$('wa').value,priority:$('wp').value,due:$('wd').value,why:$('wwhy').value,critical:$('wc').checked,resultProducing:$('wr').checked};google.script.run.withFailureHandler(e=>alert(e.message||e)).withSuccessHandler(()=>load()).captureInbox(o)}

<script>
function openChecklist(id){google.script.run.withFailureHandler(e=>alert(e.message||e)).withSuccessHandler(r=>{let run=r.run;$('modalTitle').textContent=run['Checklist Name']+' — '+run['Period Key'];$('modalBody').innerHTML=`<div class="callout">Completion: ${esc(run['Completion %'])}% • ${esc(run.Status)} • Exceptions: ${esc(run.Exceptions)}</div><div id="items">${r.items.map(i=>checkItem(run,i)).join('')}</div><button class="btn primary" style="margin-top:12px" onclick="completeChecklist('${esc(run['Run ID'])}')">Complete Checklist</button>`;$('modal').classList.add('open')}).getChecklistRun(id)}
function checkItem(run,i){let s=i.state||{}, st=s.status||'';return `<div class="checkItem"><div class="checkHead"><div><b>${esc(i.Item)}</b><small style="display:block;color:var(--muted)">${/yes/i.test(i['Required?']||'')?'Required':'Optional'}${/yes/i.test(i['Evidence Required?']||'')?' • Evidence required':''}</small></div>${st?badge(st):''}</div><div class="statusBtns"><button class="pass" onclick="saveItem('${esc(run['Run ID'])}','${esc(i['Item ID'])}','PASS')">PASS</button><button class="fail" onclick="saveItem('${esc(run['Run ID'])}','${esc(i['Item ID'])}','FAIL')">FAIL</button><button class="na" onclick="saveItem('${esc(run['Run ID'])}','${esc(i['Item ID'])}','N/A')">N/A</button></div><input id="note_${esc(i['Item ID'])}" placeholder="Note / explanation" value="${esc(s.note||'')}" style="width:100%;margin-top:7px;padding:8px;border:1px solid var(--line);border-radius:8px"><input id="ev_${esc(i['Item ID'])}" placeholder="Evidence / Drive link" value="${esc(s.evidence||'')}" style="width:100%;margin-top:6px;padding:8px;border:1px solid var(--line);border-radius:8px"></div>`}
function saveItem(runId,itemId,status){let payload={runId,itemId,status,note:$('note_'+itemId).value,evidence:$('ev_'+itemId).value};google.script.run.withFailureHandler(e=>alert(e.message||e)).withSuccessHandler(r=>openChecklist(runId)).saveChecklistItem(payload)}
function completeChecklist(id){google.script.run.withFailureHandler(e=>alert(e.message||e)).withSuccessHandler(()=>{closeModal();load()}).completeChecklist(id)}
function closeModal(){$('modal').classList.remove('open')}
</script>
<!-- ===== END HQ_Checklist_UI.html ===== -->
 
 
<!-- ===== BEGIN HQ_Bootstrap_UI.html ===== -->
<script>
function safeRender(name,fn){try{fn()}catch(e){console.error(name+' render failed',e)}}
function renderAll(){
 safeRender('HOME',renderHome);
 safeRender('MY WORK',renderWork); safeRender('MANAGE',renderManage); safeRender('STORE',renderStore);
 safeRender('EDIBLE',renderEdible); safeRender('GARDENIA',renderGardenia); safeRender('FINANCE',renderFinance);
 safeRender('LEGACY',renderLegacy); safeRender('PROPERTY',renderProperty); safeRender('PEOPLE',renderPeople);
 safeRender('PODCAST',renderPodcast); safeRender('PERSONAL',renderPersonal); safeRender('IRON',renderIron);
 safeRender('CLOSE',renderClose); safeRender('INTELLIGENCE',renderIntel); safeRender('CUSTOMERS',renderCustomers);
 safeRender('DECISIONS',renderDecisions); safeRender('CAPTURE',renderAdd);
}
function mergeChunk(d){if(!d)return;Object.keys(d).forEach(function(k){if(k==='user'||k==='period')return;DATA[k]=d[k]});renderAll()}
function loadChunk(name){google.script.run.withFailureHandler(function(e){console.error('Chunk '+name+' failed',e)}).withSuccessHandler(function(s){try{mergeChunk(JSON.parse(s||'{}'))}catch(e){console.error('Chunk '+name+' parse failed',e)}}).getBootstrapChunkJson(name)}
function startupFail(e){
 var msg=(e&&e.message)?e.message:String(e||'Unknown startup error');
 $('userName').textContent='Startup error'; $('userRole').textContent=msg; $('release').textContent='Release 1.4.9';
 $('home').innerHTML='<div class="card"><h2>Startup error</h2><p>'+esc(msg)+'</p></div>';
}
window.hqApplyBootstrap=function(s){
 try{
   var d=JSON.parse(s||'{}');
   DATA=Object.assign(DATA,d); var u=d.user||{};
   $('userName').textContent=u.name||u.email||'Ahmad HQ'; $('userRole').textContent=u.role||'Connected'; $('release').textContent='Release 1.4.9';
   renderHome();
   setTimeout(function(){renderAll()},0);
   setTimeout(function(){loadChunk('ops')},100);
   setTimeout(function(){loadChunk('admin')},400);
   setTimeout(function(){loadChunk('intel')},800);
 }catch(e){
   $('userName').textContent='Render error'; $('userRole').textContent=String(e&&e.message||e); $('release').textContent='Release 1.4.9';
   $('home').innerHTML='<div class="card"><h2>Connected — render error</h2><p>'+esc(String(e&&e.message||e))+'</p></div>';
   console.error(e);
 }
};
function startAhmadHQ(){
 $('home').innerHTML='<div class="card"><h2>Ahmad HQ</h2><p>Connecting to the management system…</p></div>';
 google.script.run.withFailureHandler(startupFail).withSuccessHandler(window.hqApplyBootstrap).getBootstrapLiteJson();
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',startAhmadHQ); else startAhmadHQ();
</script>
<!-- ===== END HQ_Bootstrap_UI.html ===== -->
</body></html>
